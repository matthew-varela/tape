name: Tape
options:
  bundleIdPrefix: com.tape
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Once enrolled in the Apple Developer Program, generate the project with
    # your Team ID, e.g. `DEVELOPMENT_TEAM=ABCDE12345 xcodegen generate`.
    # Left empty it builds fine for the simulator; a team is required to
    # archive for TestFlight / the App Store.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "8.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
targets:
  Tape:
    type: application
    platform: iOS
    sources:
      - path: Tape
    resources:
      - path: Tape/Resources
    settings:
      base:
        INFOPLIST_FILE: Tape/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tape.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Permission strings live in Tape/Resources/Info.plist, not here. Because
    # INFOPLIST_FILE points at a literal plist, NS*UsageDescription build
    # settings are never read — having them in both places just invites drift.
    #
    # No CODE_SIGN_ENTITLEMENTS: the app has no entitlement-gated capabilities.
    # StoreKit subscriptions do not need one. If Xcode adds an entitlements
    # file via Signing & Capabilities, it will be wiped on the next
    # `xcodegen generate` unless it is declared here.
    dependencies:
      - package: Kingfisher
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
