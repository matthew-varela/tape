spring.application.name=tape-api

# Render and local: Spring binds PORT from environment when present
server.port=${PORT:8080}

# Enable Firebase Admin + Bearer filter on production (set TAPE_FIREBASE_ENABLED=true on Render).
tape.firebase.enabled=${TAPE_FIREBASE_ENABLED:false}

tape.firebase.public-paths[0]=/api/health

# Suppress "open-in-view" warning; database queries are not needed during view rendering.
spring.jpa.open-in-view=false

# Schema management: Flyway owns the schema (db/migration/V*.sql) and Hibernate
# only validates that the entities match it. If validate ever blocks a deploy
# due to a type mismatch, set SPRING_JPA_HIBERNATE_DDL_AUTO=none on Render as a
# safe fallback (Flyway still applies the schema).
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# The production database predates Flyway, so it already has the V1 tables but
# no schema history. Without baselining, Flyway aborts on a non-empty schema.
# Baselining at V1 marks the existing tables as applied and runs V2 onwards.
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}

# Suppress auto-generated security password noise; auth is handled by Firebase filter.
spring.security.user.password=${SPRING_SECURITY_PASSWORD:disabled}

# Optional S3 (used when keys are non-empty)
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:local-dev}
