spring.application.name=tape-api

# Render and local: Spring binds PORT from environment when present
server.port=${PORT:8080}

# Enable Firebase Admin + Bearer filter on production (set TAPE_FIREBASE_ENABLED=true on Render).
tape.firebase.enabled=${TAPE_FIREBASE_ENABLED:false}

tape.firebase.public-paths[0]=/api/health

# Suppress "open-in-view" warning; database queries are not needed during view rendering.
spring.jpa.open-in-view=false

# Suppress auto-generated security password noise; auth is handled by Firebase filter.
spring.security.user.password=${SPRING_SECURITY_PASSWORD:disabled}

# Optional S3 (used when keys are non-empty)
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:local-dev}
