# Used by @SpringBootTest and local dev without Firebase credentials
tape.firebase.enabled=false

# Local/tests run against in-memory H2. Flyway's baseline migration is written
# in PostgreSQL dialect, so we disable Flyway here and let Hibernate generate
# the H2 schema directly. (Having Flyway on the classpath otherwise flips
# Spring Boot's default ddl-auto to "none", which would leave H2 with no tables.)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
